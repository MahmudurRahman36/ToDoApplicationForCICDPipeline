name: CI/CD Pipeline

on:
  push:
    branches:
      - development

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

  deploy:
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Files to Application Server
        run: |
          # Create directory on remote if not exists
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/app"
          # Copy only necessary files for deployment
          scp -r ./docker-compose.yml ./Dockerfile ./nginx.conf ./package.json ./package-lock.json ./src ./index.html ./vite.config.js ./tailwind.config.js ./postcss.config.js ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ~/app &&
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}' &&
            sudo docker compose down --remove-orphans || true &&
            sudo docker compose up -d --build
          "
